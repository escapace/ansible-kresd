---
- name: validate knot resolver listener collection
  ansible.builtin.assert:
    that:
      - kresd_listen is sequence
      - kresd_listen is not string
      - kresd_listen | length > 0
    fail_msg: kresd_listen must be a non-empty list of listener mappings
  tags:
    - always

- name: validate knot resolver listeners
  ansible.builtin.assert:
    that:
      - item is mapping
      - (item.interface | default('')) is string
      - item.interface | default('') | length > 0
      - (item.freebind | default(false) | type_debug) == 'bool'
    fail_msg: Each Knot Resolver listener requires an interface and optional boolean freebind
  loop: "{{ kresd_listen }}"
  loop_control:
    label: "{{ item.interface | default(item) }}"
  tags:
    - always

- name: import knot resolver copr gpg key
  ansible.builtin.rpm_key:
    key: "{{ kresd_copr_rpm_key }}"
    state: present
  register: kresd_copr_rpm_key_import

- name: add knot resolver copr repository
  ansible.builtin.get_url:
    url: "{{ kresd_copr_repo_url }}"
    dest: "{{ kresd_copr_repo_dest }}"
    owner: root
    group: root
    mode: "0644"
  register: kresd_copr_repo

- name: install knot resolver
  ansible.builtin.dnf:
    name:
      - knot-resolver
      - knot-resolver-module-dnstap
      - knot-resolver-module-http
      - lua5.1-filesystem
    state: present
    update_cache: "{{ kresd_copr_rpm_key_import.changed or kresd_copr_repo.changed }}"

- name: create the knot resolver configuration directory
  ansible.builtin.file:
    path: /etc/knot-resolver
    owner: root
    group: knot-resolver
    mode: "0750"
    state: directory

- name: set knot resolver trust-anchor file permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: touch
    owner: root
    group: knot-resolver
    mode: "0640"
    modification_time: preserve
    access_time: preserve
  loop:
    - /etc/knot-resolver/icann-ca.pem
    - /etc/knot-resolver/root.hints

- name: populate package facts
  ansible.builtin.package_facts:
    manager: auto

- name: check for networkmanager configuration
  ansible.builtin.stat:
    path: /etc/NetworkManager/NetworkManager.conf
  register: kresd_network_manager_conf

- name: prevent networkmanager from managing dns
  community.general.ini_file:
    path: /etc/NetworkManager/NetworkManager.conf
    state: present
    no_extra_spaces: true
    section: main
    option: dns
    value: none
    owner: root
    group: root
    mode: "0644"
    backup: true
  when: kresd_network_manager_conf.stat.exists

- name: configure knot resolver
  ansible.builtin.template:
    src: templates/config.yaml.j2
    dest: /etc/knot-resolver/config.yaml
    owner: root
    group: knot-resolver
    mode: "0640"
    validate: /usr/bin/kresctl validate %s
  notify: kresd restart knot-resolver
  tags:
    - kresd-conf

- name: create the knot resolver drop-in directory
  ansible.builtin.file:
    path: /etc/knot-resolver/config.d
    owner: root
    group: knot-resolver
    mode: "0750"
    state: directory
  tags:
    - kresd-conf

- name: configure knot resolver drop-ins
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: knot-resolver
    mode: "0640"
  loop:
    - src: knot-resolver-defaults.lua.j2
      dest: /etc/knot-resolver/config.d/000-defaults.lua
    - src: knot-resolver-prometheus-endpoint.lua.j2
      dest: /etc/knot-resolver/config.d/650-prometheus-endpoint.lua
    - src: knot-resolver-policy-forward.lua.j2
      dest: /etc/knot-resolver/config.d/890-policy-forward.lua
    - src: knot-resolver-view-local.lua.j2
      dest: /etc/knot-resolver/config.d/998-view-local.lua
    - src: knot-resolver-view-drop.lua.j2
      dest: /etc/knot-resolver/config.d/999-view-drop.lua
  notify: kresd restart knot-resolver
  tags:
    - kresd-conf

- name: create the knot resolver systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/knot-resolver.service.d
    owner: root
    group: root
    state: directory
    mode: "0755"

- name: configure the knot resolver systemd service
  ansible.builtin.copy:
    content: |
      [Unit]
      Description=Knot Resolver Manager
      Documentation=man:knot-resolver.systemd(7)
      DefaultDependencies=no
      After=systemd-sysctl.service systemd-sysusers.service systemd-tmpfiles-setup.service local-fs.target systemd-journald.service
      Before=sysinit.target network.target nss-lookup.target shutdown.target initrd-switch-root.target
      Conflicts=shutdown.target initrd-switch-root.target
      Wants=nss-lookup.target

      [Service]
      Type=notify
      TimeoutStartSec=600s
      ExecStart=/usr/bin/knot-resolver --config=/etc/knot-resolver/config.yaml
      Environment=KRES_LOGGING_TARGET=syslog
      ExecReload=/usr/bin/kresctl --config=/etc/knot-resolver/config.yaml reload
      KillSignal=SIGINT
      WorkingDirectory=/var/lib/knot-resolver
      User=knot-resolver
      Group=knot-resolver
      CapabilityBoundingSet=CAP_NET_BIND_SERVICE CAP_SETPCAP
      AmbientCapabilities=CAP_NET_BIND_SERVICE CAP_SETPCAP

      [Install]
      WantedBy=sysinit.target
    dest: /etc/systemd/system/knot-resolver.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - kresd daemon-reload
    - kresd update-resolv-conf
    - kresd restart knot-resolver

- name: enable knot resolver
  ansible.builtin.systemd_service:
    name: knot-resolver.service
    enabled: true

- name: gather service facts
  ansible.builtin.service_facts:

- name: disable systemd-resolved
  ansible.builtin.systemd_service:
    name: systemd-resolved.service
    enabled: false
  when:
    - "'systemd-resolved.service' in (ansible_facts.services | default({}))"
    - >-
      (ansible_facts.services['systemd-resolved.service'].status |
      default('not-found')) != 'not-found'

- name: configure cloud-init
  ansible.builtin.template:
    src: cloud-init.conf.j2
    dest: /etc/cloud/cloud.cfg.d/10_dns.conf
    owner: root
    group: root
    mode: "0644"
  when: "'cloud-init' in ansible_facts.packages"

- name: configure knot resolver for ec2
  ansible.builtin.include_tasks: provider-ec2.yaml
  when: provider is defined and provider == "ec2"
  tags:
    - kresd-conf
