---
- name: kresd gather service facts before knot resolver runtime effects
  ansible.builtin.service_facts:
  listen: kresd restart knot-resolver

- name: kresd reload the systemd manager for knot resolver
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: ansible_facts.get("service_mgr") == "systemd"
  listen: kresd daemon-reload

- name: kresd update resolv.conf for knot resolver
  ansible.builtin.template:
    src: templates/resolv.conf.j2
    dest: /etc/resolv.conf
    owner: root
    group: root
    mode: "0644"
    attributes: +i
  when: ansible_facts["virtualization_type"] != "docker"
  listen: kresd update-resolv-conf

- name: kresd restart active knot resolver
  ansible.builtin.systemd_service:
    name: knot-resolver.service
    state: restarted
  when: >-
    (ansible_facts.services | default({}))
    .get("knot-resolver.service", {})
    .get("state") == "running"
  listen: kresd restart knot-resolver
